# cua-parity task catalog
#
# The set of things cua (a screenshot-driven computer-use agent) can do, each
# classified by how Veronica would approach it. This is the iterable source of
# truth: add tasks, flip `veronica_status` as we implement, fill metrics from
# runs (results/ holds the measured numbers).
#
# bucket:
#   native   - pure system/FS/process/network op; kernel sees it; no pixels; we win
#   headless - GUI task with a CLI/headless/API equivalent; achievable, no pixels
#   blind    - genuinely perceptual/graphical; eBPF can't see pixels; out of reach today
#
# veronica_status: not-started | partial | done | out-of-scope
# ebpf_visible: does the kernel emit a signal that confirms this happened?

meta:
  version: 0
  cua_reference:
    osworld_tasks: 369
    osworld_human_success: 0.7236
    osworld_sota_note: "SOTA CUAs now exceed human success (mid-80s% on some 2026 trackers); efficiency, not capability, is the differentiator"
    efficiency_baseline:
      excess_steps_multiplier: "1.4x-2.7x more steps than necessary"
      latency_in_llm_calls: "75%-94% of total task latency"
      screenshots_per_task: "one per step (many redundant)"
  veronica_target:
    screenshots_per_task: 0        # for native + headless buckets
    llm_calls_per_task: 1          # event -> decision (goal-driven mode may use more)

# ---------------------------------------------------------------------------
# 🟢 NATIVE — kernel already sees it. Veronica's home turf.
# ---------------------------------------------------------------------------
tasks:
  - id: native.file.organize
    cua_task: "Move/rename/organize files in a file manager"
    bucket: native
    ebpf_visible: true            # openat / rename syscalls
    veronica_approach: "exec mv/rename; file_open events confirm"
    veronica_status: partial

  - id: native.pkg.install
    cua_task: "Install a software package via GUI/terminal"
    bucket: native
    ebpf_visible: true            # process_exec of apt/uv/pip
    veronica_approach: "exec apt/uv install; process_exec + process_exit confirm"
    veronica_status: partial

  - id: native.pkg.typosquat_guard
    cua_task: "(cua wouldn't) install a package"
    bucket: native
    ebpf_visible: true
    veronica_approach: "detect typosquat on pip install, kill install"
    veronica_status: done          # examples.md #10

  - id: native.config.edit_validate_reload
    cua_task: "Edit a config file in an editor, save, restart the service"
    bucket: native
    ebpf_visible: true            # file_open write to /etc, process_exec
    veronica_approach: "on write to nginx.conf: nginx -t, systemctl reload"
    veronica_status: done          # examples.md #9

  - id: native.perm.revert_dangerous
    cua_task: "Change file permissions"
    bucket: native
    ebpf_visible: true
    veronica_approach: "detect chmod 777 on sensitive file, enforce revert to 640"
    veronica_status: done          # examples.md #4

  - id: native.net.block_ip
    cua_task: "Change firewall / network settings"
    bucket: native
    ebpf_visible: true            # net_connect kprobe
    veronica_approach: "enforce deny on IP (iptables), or XDP drop"
    veronica_status: partial

  - id: native.net.port_redirect
    cua_task: "Set up a port forward / redirect"
    bucket: native
    ebpf_visible: true
    veronica_approach: "transform dport=80 -> dport=8080 via iptables NAT"
    veronica_status: partial

  - id: native.proc.limit_runaway
    cua_task: "Open a system monitor and limit/kill a runaway process"
    bucket: native
    ebpf_visible: true            # perf events, sched tracepoints
    veronica_approach: "measure cpu/io, schedule renice or cgroup cap"
    veronica_status: partial

  - id: native.proc.crash_recovery
    cua_task: "Restart a crashed service"
    bucket: native
    ebpf_visible: true            # process_exit with nonzero code
    veronica_approach: "on nginx exit!=0: check logs, validate, restart"
    veronica_status: done          # examples.md #3

  - id: native.scaffold.from_dir
    cua_task: "Create a new project folder and set up boilerplate"
    bucket: native
    ebpf_visible: true            # process_exec of mkdir
    veronica_approach: "infer stack from dir name, uv init + scaffold"
    veronica_status: done          # examples.md #1

  - id: native.scaffold.from_spec
    cua_task: "Read a spec doc and create the described project"
    bucket: native
    ebpf_visible: true            # file_open write to *_project.md
    veronica_approach: "read spec, scaffold files in same dir"
    veronica_status: done          # examples.md #11

  - id: native.download.auto_extract
    cua_task: "Download a file and extract the archive"
    bucket: native
    ebpf_visible: true            # process_exec of curl/wget
    veronica_approach: "detect archive, extract, clean up"
    veronica_status: partial       # examples.md #5 (executor timeout in VM)

  - id: native.repo.auto_setup
    cua_task: "Clone a repo and install its dependencies"
    bucket: native
    ebpf_visible: true            # process_exec of git
    veronica_approach: "detect manifest, uv sync / npm i / go mod download"
    veronica_status: partial       # examples.md #2

  - id: native.security.hardening
    cua_task: "Generate an SSH key"
    bucket: native
    ebpf_visible: true
    veronica_approach: "replace RSA with ed25519, fix perms"
    veronica_status: done          # examples.md #7

# ---------------------------------------------------------------------------
# 🟡 HEADLESS — GUI task with a CLI/headless/API equivalent. Needs goal-driven
# mode + tool adapters, but still zero screenshots.
# ---------------------------------------------------------------------------
  - id: headless.calc.find_replace
    cua_task: "Find-and-replace a value across a spreadsheet in LibreOffice Calc"
    bucket: headless
    ebpf_visible: false           # in-app edit, no distinct syscall signal
    veronica_approach: "soffice --headless macro, or parse/rewrite xlsx directly"
    veronica_status: not-started
    needs: [goal-driven-mode, adapter:libreoffice-headless]

  - id: headless.calc.formula_fill
