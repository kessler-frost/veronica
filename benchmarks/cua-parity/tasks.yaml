  - id: headless.db.query
    cua_task: "Open a DB GUI and run a query, export results"
    bucket: headless
    ebpf_visible: true            # net_connect to db port
    veronica_approach: "exec sqlite/psql, redirect to file"
    veronica_status: not-started
