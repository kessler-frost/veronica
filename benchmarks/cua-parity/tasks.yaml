    ebpf_visible: true            # net_connect to smtp
    veronica_approach: "SMTP client / API call"
    veronica_status: not-started
    needs: [goal-driven-mode]

# ---------------------------------------------------------------------------
# 🔴 BLIND — genuinely perceptual. eBPF sees no pixels. Out of reach today.
# These define the honest boundary; cua's screenshot approach is irreplaceable
# here without adding a perception fallback to Veronica.
# ---------------------------------------------------------------------------
  - id: blind.layout.judge
    cua_task: "Pick which slide layout looks better / arrange elements visually"
    bucket: blind
    ebpf_visible: false
    veronica_approach: "none — requires visual judgment"
    veronica_status: out-of-scope

  - id: blind.ocr.read_image_text
    cua_task: "Read text rendered inside an image / scanned doc"
    bucket: blind
    ebpf_visible: false
    veronica_approach: "OCR/vision only; kernel sees bytes, not glyphs"
    veronica_status: out-of-scope

  - id: blind.canvas.drag_nodes
    cua_task: "Drag/arrange nodes on a canvas or whiteboard (Figma-like)"
    bucket: blind
    ebpf_visible: false
    veronica_approach: "none — pixel-only interaction, no API"
    veronica_status: out-of-scope

  - id: blind.closed_gui.operate
    cua_task: "Operate a closed proprietary GUI with no CLI/API"
    bucket: blind
    ebpf_visible: false
    veronica_approach: "screenshot fallback (hybrid) or out-of-scope"
    veronica_status: out-of-scope

  - id: blind.game.play
    cua_task: "Play a game / react to real-time rendered visuals"
    bucket: blind
    ebpf_visible: false
    veronica_approach: "none — real-time pixel perception"
    veronica_status: out-of-scope
</content>
