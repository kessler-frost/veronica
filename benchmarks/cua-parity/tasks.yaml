    veronica_status: not-started
    needs: [goal-driven-mode, adapter:playwright]

  - id: headless.web.scrape_data
    cua_task: "Navigate a site and extract structured data"
    bucket: headless
    ebpf_visible: partial
    veronica_approach: "curl/HTTP + parse, or Playwright headless for JS sites"
